name: keepalive

# GitHub turns off scheduled workflows in a repo with no commits for 60 days.
# Once a month this writes the date to .github/keepalive.txt so the web edition keeps refreshing.
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .github/keepalive.txt
          git config user.email "ci@kravos.invalid"
          git config user.name "ci"
          git add .github/keepalive.txt
          git commit -m "keepalive" && git push
