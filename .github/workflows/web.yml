name: web

# Builds the web edition (data.json + index.html) and publishes it to GitHub Pages.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml', 'app/src/main/java/net/kravos/vesti/data/Sources.kt', 'app/src/main/java/net/kravos/vesti/data/Categories.kt']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds and build data.json
        run: |
          python3 web/build.py site
          cp web/index.html site/
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
