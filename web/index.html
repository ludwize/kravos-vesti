<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Kravos Vesti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B3261E'/%3E%3Crect x='14' y='12' width='36' height='42' rx='3' fill='%23FBFAF6'/%3E%3Crect x='19' y='18' width='26' height='5' fill='%2316161A'/%3E%3Crect x='19' y='27' width='11' height='10' fill='%23B3261E'/%3E%3Crect x='33' y='27' width='12' height='2' fill='%236B6B70'/%3E%3Crect x='33' y='31' width='12' height='2' fill='%236B6B70'/%3E%3Crect x='19' y='41' width='26' height='2' fill='%236B6B70'/%3E%3Crect x='19' y='45' width='20' height='2' fill='%236B6B70'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBFAF6; --ink: #16161A; --dim: #6B6B70; --rule: #E4E0D6; --accent: #B3261E; --live: #D7261E;
  --ph: #EDE9DF; --card: #FFFFFF; --hover: #F3F0E9; --shadow: 0 18px 50px rgba(20, 16, 8, .16);
  --serif: "Source Serif 4", "Iowan Old Style", Charter, Georgia, serif;
  --sans: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F0F10; --ink: #EDEAE4; --dim: #8E8E93; --rule: #2A2A2C; --accent: #FF6B5E; --live: #FF453A;
    --ph: #1E1E20; --card: #18181A; --hover: #1C1C1E; --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --paper: #0F0F10; --ink: #EDEAE4; --dim: #8E8E93; --rule: #2A2A2C; --accent: #FF6B5E; --live: #FF453A;
  --ph: #1E1E20; --card: #18181A; --hover: #1C1C1E; --shadow: 0 18px 50px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }

/* masthead */
.mast { padding-top: 22px; text-align: center; }
.mast .date { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.mast h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(38px, 6vw, 64px); line-height: 1; letter-spacing: -.02em; margin: 8px 0 14px; }
.mast .rule2 { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); height: 6px; }
.bar { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 20; }
.bar nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.bar nav::-webkit-scrollbar { display: none; }
.bar nav a { padding: 13px 14px 11px; font-weight: 600; font-size: 14px; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.bar nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
.bar nav a:hover { color: var(--ink); }
.bar nav .short { display: none; }
.tools { display: flex; align-items: center; gap: 2px; }
.icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; color: var(--dim); }
.icon:hover { background: var(--hover); color: var(--ink); }
.icon svg { width: 20px; height: 20px; }
.badge { font-size: 10px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 9px; padding: 0 5px; margin-left: -10px; margin-top: -14px; }

/* section head */
.shead { display: flex; align-items: flex-end; gap: 18px; padding: 26px 0 10px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
.shead h2 { font-family: var(--serif); font-size: 40px; line-height: 1; margin: 0; font-weight: 800; letter-spacing: -.015em; }
.kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.catbtn { display: inline-flex; align-items: center; gap: 4px; }
.catbtn svg { width: 26px; height: 26px; color: var(--dim); }
.modes { display: flex; gap: 20px; margin-left: auto; }
.modes button { font-size: 13px; font-weight: 600; color: var(--dim); padding-bottom: 6px; border-bottom: 2px solid transparent; }
.modes button.on { color: var(--ink); border-bottom-color: var(--accent); }
.menu { position: absolute; z-index: 40; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 250px; max-height: 70vh; overflow: auto; }
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 20px; padding: 9px 12px; border-radius: 6px; font-family: var(--serif); font-size: 17px; font-weight: 600; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu button.on { color: var(--accent); }
.menu button span { font-family: var(--sans); font-size: 12px; color: var(--dim); font-weight: 500; }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 6px; }

/* stories */
.meta { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); margin-top: 8px; flex-wrap: wrap; }
.meta .cov { color: var(--accent); font-weight: 700; }
.live { font-family: var(--sans); display: inline-flex; align-items: center; gap: 5px; color: var(--live); font-weight: 700; font-size: 11px; letter-spacing: .08em; }
.livebar .live { flex: none; }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.img { background: var(--ph) center/cover no-repeat; border-radius: 4px; }
.story { display: block; cursor: pointer; }
.story:hover .hl { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.hl { font-family: var(--serif); font-weight: 700; letter-spacing: -.005em; margin: 0; }
.dek { color: var(--dim); margin: 8px 0 0; font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.front { display: grid; grid-template-columns: 1.65fr 1fr; gap: 0 36px; padding: 22px 0 8px; }
.front .lead .img { aspect-ratio: 16/9; margin-bottom: 14px; }
.front .lead .hl { font-size: 34px; line-height: 1.12; }
.front .side { border-left: 1px solid var(--rule); padding-left: 28px; }
.front .side .story { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.front .side .story:first-child { padding-top: 0; }
.front .side .story:last-child { border-bottom: 0; }
.front .side .hl { font-size: 19px; line-height: 1.25; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 32px; padding: 6px 0 20px; border-top: 1px solid var(--rule); margin-top: 12px; }
.grid .story { padding: 18px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 14px; }
.grid .story .txt { flex: 1; min-width: 0; }
.grid .story .img { width: 84px; height: 84px; flex: none; }
.grid .hl { font-size: 18px; line-height: 1.28; }

.block { margin-top: 26px; }
.block .bh { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.block .bh a { font-size: 13px; color: var(--dim); font-weight: 600; }
.block .bh a:hover { color: var(--ink); }
.livebar { display: flex; flex-direction: column; border-bottom: 1px solid var(--rule); }
.livebar a { display: flex; gap: 14px; align-items: baseline; flex-wrap: nowrap; padding: 12px 0; font-family: var(--serif); font-size: 18px; font-weight: 600; }
.livebar a + a { border-top: 1px solid var(--rule); }
.livebar a:hover { text-decoration: underline; }

/* wire (Najnovije) */
.wire { padding: 6px 0 30px; }
.wire .row { display: grid; grid-template-columns: 64px 150px 1fr 64px; gap: 16px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.wire .row:hover .hl { text-decoration: underline; }
.wire .tm { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; padding-top: 3px; }
.wire .src { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding-top: 4px; }
.wire .hl { font-size: 18px; line-height: 1.3; }
.wire .img { width: 64px; height: 48px; }
.wire .more { color: var(--accent); font-size: 12px; font-weight: 700; margin-left: 6px; font-family: var(--sans); }

/* story panel */
.scrim { position: fixed; inset: 0; background: rgba(10, 8, 4, .38); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--paper); z-index: 60; transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; box-shadow: var(--shadow); }
.panel.on { transform: none; }
.panel .top { position: sticky; top: 0; background: var(--paper); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--rule); z-index: 2; }
.panel .top .t { flex: 1; font-size: 13px; color: var(--dim); font-weight: 600; }
.panel .body { padding: 22px 32px 60px; }
.panel h2 { font-family: var(--serif); font-size: 32px; line-height: 1.15; margin: 10px 0 18px; letter-spacing: -.01em; }
.panel .hero { aspect-ratio: 16/9; margin-bottom: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 22px; }
.chips span { border: 1px solid var(--rule); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 500; }
.panel h3 { font-family: var(--serif); font-size: 22px; margin: 6px 0 4px; border-top: 1px solid var(--rule); padding-top: 18px; }
.cov-item { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.cov-item .txt { flex: 1; }
.cov-item .src { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.cov-item .src i { font-style: normal; color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 500; margin-left: 8px; }
.cov-item a.hl { display: block; font-size: 19px; line-height: 1.3; margin-top: 4px; }
.cov-item a.hl:hover { text-decoration: underline; }
.cov-item a.hl::after { content: " ↗"; color: var(--dim); font-family: var(--sans); font-size: 14px; }
.save { width: 34px; height: 34px; flex: none; border-radius: 8px; display: grid; place-items: center; color: var(--dim); }
.save:hover { background: var(--hover); }
.save.on { color: var(--accent); }
.save svg { width: 19px; height: 19px; }

.foot { color: var(--dim); font-size: 12px; padding: 26px 0 50px; border-top: 1px solid var(--rule); margin-top: 20px; }
.empty { color: var(--dim); text-align: center; padding: 70px 20px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 70; }
.toast.on { opacity: 1; }

@media (max-width: 980px) {
  .front { grid-template-columns: 1fr; }
  .front .side { border-left: 0; padding-left: 0; margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .bar nav a { padding: 13px 4px 11px; font-size: 12px; }
  .bar { gap: 2px; }
  .tools .icon { width: 28px; }
  .tools .icon { width: 32px; }
  .bar nav .full { display: none; }
  .bar nav .short { display: inline; }
  .mast h1 { font-size: 40px; }
  .shead h2 { font-size: 32px; }
  .modes { margin-left: 0; width: 100%; }
  .front .lead .hl { font-size: 26px; }
  .grid { grid-template-columns: 1fr; }
  .wire .row { grid-template-columns: 1fr 56px; gap: 4px 12px; }
  .wire .tm, .wire .src { grid-column: 1; display: inline; }
  .wire .row > .tm { display: none; }
  .wire .hl { grid-column: 1; font-size: 17px; }
  .wire .img { grid-column: 2; grid-row: 1 / span 2; width: 56px; height: 56px; }
  .panel .body { padding: 18px 18px 60px; }
  .panel h2 { font-size: 26px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="date" id="date"></div>
    <h1>Kravos Vesti</h1>
    <div class="rule2"></div>
  </header>
  <div class="bar">
    <nav id="nav"></nav>
    <div class="tools">
      <a class="icon" href="#/sacuvano" title="Sačuvano" aria-label="Sačuvano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></a><span class="badge" id="savedCount" hidden></span>
      <button class="icon" id="theme" title="Tema" aria-label="Tema"></button>
    </div>
  </div>
  <main id="main"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const TABS = [
    { id: "danas", label: "Danas", sec: null },
    { id: "srbija", label: "Srbija", sec: "SRBIJA" },
    { id: "beograd", label: "Beograd", sec: "BEOGRAD" },
    { id: "svet", label: "Svet", sec: "SVET" },
    { id: "bezbednost", label: "Bezbednost", short: "Sajber", sec: "BEZBEDNOST" },
    { id: "sport", label: "Sport", sec: "SPORT" },
  ];
  const DAYS = ["nedelja", "ponedeljak", "utorak", "sreda", "četvrtak", "petak", "subota"];
  const MONTHS = ["januar", "februar", "mart", "april", "maj", "jun", "jul", "avgust", "septembar", "oktobar", "novembar", "decembar"];
  const MON = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "avg", "sep", "okt", "nov", "dec"];
  const ICON_BM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
  const ICON_BM_ON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const ICON_DD = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>';
  const THEME_ICONS = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let data = null;
  let byId = {};          // story id -> story
  let artIndex = {};      // article id -> {a, story}
  let state = { tab: "danas", cat: null, mode: "top" };
  let saved = store.get("kv-saved", []);
  let openMenu = null;

  // ---------------- formatting
  const now = () => Date.now() / 1000;
  function ago(ts) {
    const m = Math.floor((now() - ts) / 60);
    if (m < 1) return "upravo";
    if (m < 60) return `pre ${m} min`;
    const d = new Date(ts * 1000), t = new Date();
    const y = new Date(t); y.setDate(t.getDate() - 1);
    if (m < 12 * 60 || d.toDateString() === t.toDateString()) return `pre ${Math.floor(m / 60)} h`;
    if (d.toDateString() === y.toDateString()) return `juče ${clock(ts)}`;
    return `${d.getDate()}. ${MON[d.getMonth()]}`;
  }
  const clock = (ts) => { const d = new Date(ts * 1000); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const izvora = (n) => (n % 10 === 1 && n % 100 !== 11 ? `${n} izvor` : `${n} izvora`);
  const srcName = (id) => (data.sources[id] || { name: id }).name;
  const sources = (st) => [...new Set(st.a.map((x) => x.s))];
  const latest = (st) => Math.max(...st.a.map((x) => x.ts));
  const storyCats = (st) => new Set(st.a.flatMap((x) => x.c));
  const imgOf = (st) => (st.a.find((x) => x.i) || {}).i;

  // ---------------- theme
  function applyTheme() {
    const t = store.get("kv-theme", "system");
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    $("#theme").innerHTML = THEME_ICONS[t];
    $("#theme").title = { system: "Tema: sistem", light: "Tema: svetla", dark: "Tema: tamna" }[t];
  }
  $("#theme").onclick = () => {
    const order = ["system", "light", "dark"];
    store.set("kv-theme", order[(order.indexOf(store.get("kv-theme", "system")) + 1) % 3]);
    applyTheme();
  };

  // ---------------- routing:  #/srbija/politika?n  (n = Najnovije)
  function readHash() {
    const h = location.hash.replace(/^#\/?/, "");
    const [path, q] = h.split("?");
    const [tab, cat] = path.split("/");
    if (tab === "sacuvano") return { tab: "sacuvano", cat: null, mode: "top" };
    return { tab: TABS.some((t) => t.id === tab) ? tab : "danas", cat: cat || null, mode: q === "n" ? "new" : "top" };
  }
  function go(tab, cat, mode) {
    const h = `#/${tab}${cat ? "/" + cat : ""}${mode === "new" ? "?n" : ""}`;
    if (location.hash !== h) location.hash = h; else render();
  }
  window.addEventListener("hashchange", () => { state = readHash(); closePanel(true); render(); window.scrollTo(0, 0); });

  // ---------------- data
  async function load(first) {
    try {
      const r = await fetch("data.json?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      const d = await r.json();
      if (data && d.generated === data.generated) return;
      data = d;
      byId = {}; artIndex = {};
      for (const lst of Object.values(data.sections)) for (const st of lst) { byId[st.id] = st; for (const a of st.a) artIndex[a.id] = { a, st }; }
      render(!first);
    } catch (e) {
      if (first) $("#main").innerHTML = `<div class="empty">Vesti trenutno ne mogu da se učitaju.<br>${esc(e.message)}</div>`;
    }
  }

  // ---------------- rendering helpers
  function meta(st) {
    const srcs = sources(st);
    const live = st.a.some((x) => x.l);
    const names = srcs.slice(0, 3).map(srcName).join(" · ") + (srcs.length > 3 ? ` +${srcs.length - 3}` : "");
    return `<div class="meta">${live ? '<span class="live">UŽIVO</span>' : ""}${srcs.length > 1 ? `<span class="cov">${izvora(srcs.length)}</span>` : ""}<span>${esc(names)}</span><span>·</span><span>${ago(latest(st))}</span></div>`;
  }
  const img = (url, cls = "") => (url ? `<div class="img ${cls}" style="background-image:url('${esc(url).replace(/'/g, "%27")}')"></div>` : "");
  function lead(st) {
    const a = st.a[0];
    return `<div class="story lead" data-s="${st.id}">${img(imgOf(st))}<h3 class="hl">${esc(a.t)}</h3>${a.d ? `<p class="dek">${esc(a.d)}</p>` : ""}${meta(st)}</div>`;
  }
  const side = (st) => `<div class="story" data-s="${st.id}"><h3 class="hl">${esc(st.a[0].t)}</h3>${meta(st)}</div>`;
  const card = (st) => `<div class="story" data-s="${st.id}"><div class="txt"><h3 class="hl">${esc(st.a[0].t)}</h3>${meta(st)}</div>${img(imgOf(st))}</div>`;
  function frontPage(list) {
    if (!list.length) return "";
    const [first, ...rest] = list;
    return `<section class="front"><div>${lead(first)}</div><div class="side">${rest.slice(0, 4).map(side).join("")}</div></section>` +
      (rest.length > 4 ? `<section class="grid">${rest.slice(4).map(card).join("")}</section>` : "");
  }

  function sectionHead(tab) {
    const cats = data.categories.filter((c) => c.section === tab.sec);
    const cat = cats.find((c) => c.id === state.cat);
    return `<div class="shead">
      <div><div class="kicker" ${cat ? "" : 'style="color:var(--dim)"'}>${cat ? esc(tab.label) : "Sve kategorije"}</div>
        <button class="catbtn" id="catbtn" aria-haspopup="true"><h2>${esc(cat ? cat.label : tab.label)}</h2>${ICON_DD}</button></div>
      <div class="modes"><button data-m="top" class="${state.mode === "top" ? "on" : ""}">Najvažnije</button><button data-m="new" class="${state.mode === "new" ? "on" : ""}">Najnovije</button></div>
    </div>`;
  }

  function wire(list) {
    const cov = {};
    for (const lst of Object.values(data.sections)) for (const st of lst) { const n = sources(st).length - 1; if (n > 0) for (const a of st.a) cov[a.id] = n; }
    const arts = list.flatMap((st) => st.a).sort((x, y) => y.ts - x.ts).slice(0, 250);
    if (!arts.length) return `<div class="empty">Trenutno nema vesti u ovoj kategoriji.</div>`;
    return `<section class="wire">${arts.map((a) => `<div class="row" data-a="${a.id}">
      <div class="tm">${clock(a.ts)}</div>
      <div class="src">${a.l ? '<span class="live">UŽIVO</span> ' : ""}${esc(srcName(a.s))}<span style="color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none"> · ${ago(a.ts)}</span></div>
      <div class="hl">${esc(a.t)}${cov[a.id] ? `<span class="more">+${cov[a.id]}</span>` : ""}</div>
      ${a.i ? img(a.i) : "<div></div>"}</div>`).join("")}</section>`;
  }

  function render() {
    if (!data && state.tab !== "sacuvano") return;
    document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("on", a.dataset.t === state.tab));
    const main = $("#main");
    let html = "";
    if (state.tab === "sacuvano") html = renderSaved();
    else if (state.tab === "danas") html = state.mode === "new" ? danasHead() + wire(Object.values(data.sections).flat()) : danasHead() + renderDanas();
    else {
      const tab = TABS.find((t) => t.id === state.tab);
      let list = data.sections[tab.sec] || [];
      if (state.cat) list = list.filter((st) => storyCats(st).has(state.cat));
      html = sectionHead(tab) + (state.mode === "new" ? wire(list) : list.length ? frontPage(list.slice(0, 160)) : `<div class="empty">Trenutno nema vesti u ovoj kategoriji.</div>`);
    }
    main.innerHTML = html;
    renderFoot();
    bind();
  }

  function danasHead() {
    return `<div class="shead"><div><div class="kicker" style="color:var(--dim)">Pregled dana</div><h2>Danas</h2></div>
      <div class="modes"><button data-m="top" class="${state.mode === "top" ? "on" : ""}">Najvažnije</button><button data-m="new" class="${state.mode === "new" ? "on" : ""}">Najnovije</button></div></div>`;
  }

  function renderDanas() {
    let html = "";
    const live = (data.sections.SRBIJA || []).flatMap((st) => st.a).filter((a) => a.l && now() - a.ts < 12 * 3600).sort((x, y) => y.ts - x.ts).slice(0, 2);
    if (live.length) html += `<div class="livebar">${live.map((a) => `<a href="${esc(a.u)}" target="_blank" rel="noopener"><span class="live">UŽIVO</span><span>${esc(a.t)}</span></a>`).join("")}</div>`;
    for (const [sec, tabId, n] of [["SRBIJA", "srbija", 9], ["BEOGRAD", "beograd", 5], ["SVET", "svet", 7], ["BEZBEDNOST", "bezbednost", 5], ["SPORT", "sport", 5]]) {
      const list = (data.sections[sec] || []).slice(0, n);
      if (!list.length) continue;
      const tab = TABS.find((t) => t.id === tabId);
      html += `<section class="block"><div class="bh"><span class="kicker">${esc(tab.label)}</span><a href="#/${tabId}">Sve ›</a></div>`;
      if (sec === "BEZBEDNOST") html += `<section class="grid" style="border-top:0;margin-top:0">${list.map(card).join("")}</section>`;
      else html += frontPage(list);
      html += `</section>`;
    }
    return html;
  }

  function renderSaved() {
    const head = `<div class="shead"><div><div class="kicker">Za kasnije</div><h2>Sačuvano</h2></div></div>`;
    if (!saved.length) return head + `<div class="empty">Ništa još nije sačuvano.<br>Otvori priču i dodirni obeleživač pored članka.<br><small>Sačuvano na webu se čuva u ovom pregledaču.</small></div>`;
    return head + `<section class="wire">${saved.map((a) => `<div class="row" data-u="${esc(a.u)}">
      <div class="tm">${clock(a.ts)}</div><div class="src">${esc(a.sn || srcName(a.s))}</div>
      <div class="hl">${esc(a.t)}</div>
      <button class="save on" data-unsave="${a.id}" title="Ukloni">${ICON_X}</button></div>`).join("")}</section>`;
  }

  function renderFoot() {
    const f = data ? `Ažurirano u ${clock(data.generated)} (${ago(data.generated)}) · osvežava se samo` + (data.failed.length ? ` · trenutno ne odgovaraju: ${esc(data.failed.join(", "))}` : "") : "";
    $("#foot").innerHTML = `${f}<br>Naslovi i kratki opisi iz javnih RSS kanala izdavača; svaki članak vodi na originalni sajt.`;
    $("#savedCount").hidden = !saved.length;
    $("#savedCount").textContent = saved.length;
  }

  function fmtDate() { const d = new Date(); return `${DAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}`; }

  // ---------------- interactions
  function bind() {
    document.querySelectorAll("[data-s]").forEach((el) => el.onclick = () => openStory(el.dataset.s));
    document.querySelectorAll("[data-a]").forEach((el) => el.onclick = () => {
      const x = artIndex[el.dataset.a];
      if (x && sources(x.st).length > 1) openStory(x.st.id); else if (x) window.open(x.a.u, "_blank", "noopener");
    });
    document.querySelectorAll("[data-u]").forEach((el) => el.onclick = (e) => { if (!e.target.closest("[data-unsave]")) window.open(el.dataset.u, "_blank", "noopener"); });
    document.querySelectorAll("[data-unsave]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); toggleSave(el.dataset.unsave); render(); });
    document.querySelectorAll(".modes [data-m]").forEach((b) => b.onclick = () => go(state.tab, state.cat, b.dataset.m));
    const cb = $("#catbtn");
    if (cb) cb.onclick = (e) => { e.stopPropagation(); showCatMenu(cb); };
  }

  function showCatMenu(anchor) {
    closeMenu();
    const tab = TABS.find((t) => t.id === state.tab);
    const counts = {};
    for (const st of data.sections[tab.sec] || []) for (const c of storyCats(st)) counts[c] = (counts[c] || 0) + 1;
    const cats = data.categories.filter((c) => c.section === tab.sec && counts[c.id]);
    const m = document.createElement("div");
    m.className = "menu";
    m.innerHTML = `<button data-c="" class="${state.cat ? "" : "on"}">Sve vesti<span>${(data.sections[tab.sec] || []).length}</span></button><hr>` +
      cats.map((c) => `<button data-c="${c.id}" class="${state.cat === c.id ? "on" : ""}">${esc(c.label)}<span>${counts[c.id]}</span></button>`).join("");
    const r = anchor.getBoundingClientRect();
    m.style.left = r.left + window.scrollX + "px";
    m.style.top = r.bottom + window.scrollY + 6 + "px";
    document.body.appendChild(m);
    m.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { closeMenu(); go(state.tab, b.dataset.c || null, state.mode); });
    openMenu = m;
  }
  function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
  document.addEventListener("click", (e) => { if (openMenu && !openMenu.contains(e.target)) closeMenu(); });

  // ---------------- story panel ("Kako ko piše")
  let panelOpen = false;
  function openStory(id) {
    const st = byId[id];
    if (!st) return;
    if (st.a.length === 1 && sources(st).length === 1) { window.open(st.a[0].u, "_blank", "noopener"); return; }
    const srcs = sources(st);
    const first = Math.min(...st.a.map((x) => x.ts));
    const p = $("#panel");
    p.innerHTML = `<div class="top"><span class="t">${esc(izvora(srcs.length))} · prvi izveštaj ${ago(first)}</span><button class="icon" id="pclose" aria-label="Zatvori">${ICON_X}</button></div>
      <div class="body">
        ${st.a.some((x) => x.l) ? '<span class="live">UŽIVO</span>' : ""}
        <h2>${esc(st.a[0].t)}</h2>
        ${imgOf(st) ? img(imgOf(st), "hero") : ""}
        <div class="kicker" style="color:var(--dim)">Prate priču</div>
        <div class="chips">${srcs.map((s) => `<span>${esc(srcName(s))}</span>`).join("")}</div>
        <h3>Kako ko piše</h3>
        ${st.a.map((a) => `<div class="cov-item"><div class="txt">
            <div class="src">${esc(srcName(a.s))}<i>${ago(a.ts)}</i></div>
            <a class="hl" href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}</a>
            ${a.d ? `<p class="dek">${esc(a.d)}</p>` : ""}</div>
            <button class="save ${isSaved(a.id) ? "on" : ""}" data-save="${a.id}" title="Sačuvaj">${isSaved(a.id) ? ICON_BM_ON : ICON_BM}</button></div>`).join("")}
      </div>`;
    p.classList.add("on"); p.setAttribute("aria-hidden", "false");
    $("#scrim").classList.add("on");
    document.body.style.overflow = "hidden";
    p.scrollTop = 0;
    $("#pclose").onclick = () => history.back();
    p.querySelectorAll("[data-save]").forEach((b) => b.onclick = () => {
      toggleSave(b.dataset.save);
      const on = isSaved(b.dataset.save);
      b.classList.toggle("on", on); b.innerHTML = on ? ICON_BM_ON : ICON_BM;
      toast(on ? "Sačuvano" : "Uklonjeno iz sačuvanih");
    });
    if (!panelOpen) history.pushState({ panel: id }, "");
    panelOpen = true;
  }
  function closePanel(silent) {
    if (!panelOpen) return;
    panelOpen = false;
    $("#panel").classList.remove("on"); $("#panel").setAttribute("aria-hidden", "true");
    $("#scrim").classList.remove("on");
    document.body.style.overflow = "";
  }
  window.addEventListener("popstate", () => { if (panelOpen) closePanel(); });
  $("#scrim").onclick = () => history.back();
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (openMenu) closeMenu(); else if (panelOpen) history.back(); } });

  // ---------------- saved (per browser)
  const isSaved = (id) => saved.some((x) => x.id === id);
  function toggleSave(id) {
    if (isSaved(id)) saved = saved.filter((x) => x.id !== id);
    else { const x = artIndex[id]; if (x) saved.unshift({ id, t: x.a.t, u: x.a.u, s: x.a.s, sn: srcName(x.a.s), ts: x.a.ts }); }
    store.set("kv-saved", saved);
    renderFoot();
  }
  let toastT;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 1600); }

  // ---------------- start
  $("#nav").innerHTML = TABS.map((t) => `<a href="#/${t.id}" data-t="${t.id}"><span class="full">${t.label}</span><span class="short">${t.short || t.label}</span></a>`).join("");
  $("#date").textContent = fmtDate();
  applyTheme();
  state = readHash();
  load(true);
  setInterval(() => { if (!document.hidden) load(false); }, 3 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
  setInterval(() => { if (data && !openMenu) renderFoot(); }, 60 * 1000);
})();
</script>
</body>
</html>
